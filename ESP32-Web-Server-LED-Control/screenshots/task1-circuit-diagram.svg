<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ledGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" fill="url(#bgGrad)" rx="16"/>

  <!-- Title & Banner -->
  <text x="450" y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">ESP32 Web Server — LED Control Circuit Schematic</text>
  <text x="450" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Task 1: Wi-Fi STA Web Server on Port 80 · GPIO 2 / GPIO 4 Current-Limited Circuit</text>

  <!-- ==================== ESP32 MODULE ==================== -->
  <g transform="translate(60, 110)">
    <!-- PCB Board -->
    <rect width="260" height="340" rx="12" fill="#0f3d2e" stroke="#10b981" stroke-width="2.5"/>
    <rect x="25" y="20" width="210" height="150" rx="6" fill="url(#chipGrad)" stroke="#64748b" stroke-width="1.5"/>
    <text x="130" y="90" fill="#f1f5f9" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">ESP-WROOM-32</text>
    <text x="130" y="115" fill="#6ee7b7" font-family="sans-serif" font-size="11" text-anchor="middle">Wi-Fi + BLE SoC</text>

    <!-- USB Port -->
    <rect x="95" y="325" width="70" height="25" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <text x="130" y="342" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">MICRO-USB</text>

    <!-- Antenna -->
    <path d="M 40,20 L 40,5 L 220,5 L 220,20" fill="none" stroke="#eab308" stroke-width="4"/>

    <!-- Left Header Pins -->
    <text x="15" y="195" fill="#f8fafc" font-family="monospace" font-size="11">3V3</text>
    <circle cx="8" cy="192" r="5" fill="#cbd5e1"/>
    
    <text x="15" y="225" fill="#f8fafc" font-family="monospace" font-size="11">EN</text>
    <circle cx="8" cy="222" r="5" fill="#cbd5e1"/>

    <text x="15" y="255" fill="#f8fafc" font-family="monospace" font-size="11">VP</text>
    <circle cx="8" cy="252" r="5" fill="#cbd5e1"/>

    <!-- Right Header Pins -->
    <text x="210" y="195" fill="#f8fafc" font-family="monospace" font-size="11">GND</text>
    <circle cx="252" cy="192" r="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>

    <text x="200" y="235" fill="#4ade80" font-family="monospace" font-size="12" font-weight="700">GPIO 2</text>
    <circle cx="252" cy="232" r="6" fill="#22c55e" stroke="#86efac" stroke-width="2"/>

    <text x="200" y="275" fill="#94a3b8" font-family="monospace" font-size="11">GPIO 4</text>
    <circle cx="252" cy="272" r="5" fill="#cbd5e1"/>

    <text x="215" y="315" fill="#f8fafc" font-family="monospace" font-size="11">VIN</text>
    <circle cx="252" cy="312" r="5" fill="#cbd5e1"/>
  </g>

  <!-- ==================== BREADBOARD / COMPONENTS ==================== -->
  <g transform="translate(480, 130)">
    <!-- Breadboard base -->
    <rect width="360" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="180" y="32" fill="#64748b" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">SOLDERLESS BREADBOARD</text>

    <!-- Breadboard power rails -->
    <line x1="20" y1="50" x2="340" y2="50" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="20" y1="65" x2="340" y2="65" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="25" y="47" fill="#ef4444" font-size="12" font-weight="700">+</text>
    <text x="25" y="76" fill="#3b82f6" font-size="14" font-weight="700">-</text>

    <!-- Resistor 220 Ohm -->
    <g transform="translate(70, 140)">
      <text x="45" y="-14" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">220Ω Resistor</text>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#64748b" stroke-width="3"/>
      <rect x="20" y="-8" width="50" height="16" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
      <!-- Bands: Red, Red, Brown, Gold -->
      <line x1="28" y1="-8" x2="28" y2="8" stroke="#dc2626" stroke-width="3.5"/>
      <line x1="38" y1="-8" x2="38" y2="8" stroke="#dc2626" stroke-width="3.5"/>
      <line x1="48" y1="-8" x2="48" y2="8" stroke="#92400e" stroke-width="3.5"/>
      <line x1="60" y1="-8" x2="60" y2="8" stroke="#eab308" stroke-width="2.5"/>
      <line x1="70" y1="0" x2="90" y2="0" stroke="#64748b" stroke-width="3"/>
    </g>

    <!-- LED Component -->
    <g transform="translate(230, 140)">
      <text x="25" y="-28" fill="#15803d" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Green LED</text>
      <!-- Glow aura -->
      <circle cx="25" cy="0" r="24" fill="#86efac" opacity="0.5" filter="url(#glow)"/>
      <!-- LED Dome -->
      <path d="M 12,12 C 12,-16 38,-16 38,12 Z" fill="url(#ledGlow)" stroke="#15803d" stroke-width="2"/>
      <rect x="10" y="10" width="30" height="6" rx="2" fill="#16a34a"/>
      <!-- Anode lead (longer / bent) -->
      <path d="M 18,16 L 18,50" stroke="#64748b" stroke-width="3"/>
      <text x="18" y="70" fill="#0f172a" font-family="sans-serif" font-size="10" text-anchor="middle">Anode (+)</text>
      <!-- Cathode lead (flat notch) -->
      <path d="M 32,16 L 32,50" stroke="#64748b" stroke-width="3"/>
      <text x="32" y="70" fill="#0f172a" font-family="sans-serif" font-size="10" text-anchor="middle">Cathode (-)</text>
    </g>

    <!-- Connection Wire: Resistor to Anode -->
    <path d="M 160,140 L 248,140 L 248,190" fill="none" stroke="#22c55e" stroke-width="3"/>
    <!-- Connection Wire: Cathode to Ground Rail -->
    <path d="M 262,190 L 262,230 L 180,230 L 180,65" fill="none" stroke="#0284c7" stroke-width="3"/>
  </g>

  <!-- ==================== WIRING HARNESS ==================== -->
  <!-- Wire 1: ESP32 GPIO 2 -> Resistor input -->
  <path d="M 312,342 C 380,342 410,270 550,270" fill="none" stroke="#22c55e" stroke-width="4"/>
  <circle cx="312" cy="342" r="5" fill="#22c55e"/>
  <circle cx="550" cy="270" r="5" fill="#22c55e"/>
  <rect x="360" y="310" width="130" height="24" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="425" y="326" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">GPIO 2 (3.3V Logic)</text>

  <!-- Wire 2: ESP32 GND -> Breadboard Ground Rail -->
  <path d="M 312,302 C 380,302 430,195 500,195" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="312" cy="302" r="5" fill="#0284c7"/>
  <circle cx="500" cy="195" r="5" fill="#0284c7"/>
  <rect x="360" y="240" width="110" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="415" y="256" fill="#7dd3fc" font-family="monospace" font-size="11" text-anchor="middle">GND Common</text>

  <!-- Wire 3: USB 5V VBUS (Power supply to laptop) -->
  <path d="M 190,470 L 190,490 L 70,490" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="130" y="508" fill="#fde68a" font-family="sans-serif" font-size="11" text-anchor="middle">USB 5V VBUS &amp; UART 115200</text>

  <!-- Footer Info Box -->
  <rect x="60" y="468" width="780" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="75" y="492" fill="#94a3b8" font-family="sans-serif" font-size="12">
    <tspan fill="#38bdf8" font-weight="700">Logic Flow:</tspan> Browser GET /on ➔ ESP32 WebServer ➔ GPIO 2 HIGH (3.3V) ➔ 220Ω Resistor (limits current to ~10mA) ➔ LED Illuminates.
  </text>
</svg>